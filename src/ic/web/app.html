<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Incident Commander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">

  <header class="glass">
    <span class="gicon" aria-hidden="true">
      <svg viewBox="0 0 500 500"><path fill="currentColor" fill-rule="evenodd"
        d="M250 76C134 76 40 121 40 176c0 48 71 88 165 98v146h90V274c94-10 165-50 165-98 0-55-94-100-210-100z
           m0 42c-74 0-133 26-133 58s59 58 133 58 133-26 133-58-59-58-133-58z"/></svg>
    </span>
    <span class="brand">
      <b>ARGUS <span>INCIDENT COMMANDER</span></b>
      <span class="sub">Evidence-backed incident intelligence</span>
    </span>
    <span class="integrations" id="integrations" aria-live="polite"></span>
  </header>

  <div class="templates" id="templates" role="group" aria-label="Incident type">
    <button type="button" class="seg on" data-kind="fire">Fire</button>
    <button type="button" class="seg" data-kind="ems">EMS</button>
    <button type="button" class="seg" data-kind="police">Police</button>
  </div>

  <form id="form">
    <label class="sr" for="text">What were you told?</label>
    <input type="text" id="text" name="text" autocomplete="off"
      placeholder="Structure fire at 1001 Van Ness Avenue, someone may still be inside">
    <button type="submit" class="btn" id="go">Work the incident</button>
  </form>

  <form id="followup" hidden>
    <label class="sr" for="more">What else has come in?</label>
    <input type="text" id="more" autocomplete="off"
      placeholder="Caller now says…">
    <button type="submit" class="btn ghost" id="add">Add to the call</button>
  </form>
  <div class="work">
    <aside class="rail" id="rail" aria-label="Approach and open questions"></aside>
    <main id="out"></main>
  </div>

</div>
<script src="/app.js"></script>
</body>
</html>
