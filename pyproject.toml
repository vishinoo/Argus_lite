[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-incident-commander"
version = "0.1.0"
description = "An agent that turns an emergency call into an actionable, sourced incident brief"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ic = "ic.cli:main"

[tool.setuptools.package-data]
ic = ["web/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
